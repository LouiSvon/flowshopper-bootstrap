<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flowshopper - Nook's store</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#catalog">Skip to the catalog</a>
  <header>
    <h1>Flowshopper</h1>
    <p>Nook's store, ordered the easy way.</p>
  </header>
  <main>
    <form id="filters" role="search" aria-label="Filter the catalog">
      <label for="q">Search</label>
      <input id="q" type="search" autocomplete="off">
      <label for="category">Category</label>
      <select id="category"><option value="">All categories</option></select>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <section id="catalog" aria-label="Catalog">
      <ul id="products" class="grid"></ul>
      <button id="more" type="button" hidden>Show more products</button>
    </section>
    <aside id="cart" aria-label="Cart">
      <h2>Cart</h2>
      <ul id="cart-lines"></ul>
      <p>Total: <strong id="cart-total">0</strong> bells</p>
      <button id="checkout" type="button" disabled>Pay (test mode)</button>
      <p id="checkout-msg" role="status" aria-live="polite"></p>
    </aside>
  </main>
  <dialog id="detail" aria-labelledby="detail-title">
    <h2 id="detail-title"></h2>
    <p id="detail-body"></p>
    <p><strong id="detail-price"></strong> bells</p>
    <button id="detail-add" type="button">Add to cart</button>
    <button id="detail-close" type="button">Close</button>
  </dialog>
  <script type="module" src="app.js"></script>
</body>
</html>
