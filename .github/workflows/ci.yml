name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit + coverage
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run coverage
      - uses: actions/upload-artifact@v4
        with: { name: coverage, path: web/coverage/lcov.info }

  e2e:
    name: e2e phone + accessibility
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-traces, path: web/test-results }

  notebook:
    name: notebook AI s'exécute
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ai } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: ai/requirements.txt }
      - run: pip install -r requirements.txt
      - name: Télécharger MovieLens 100k
        run: |
          curl -fsSL -o ml-100k.zip https://files.grouplens.org/datasets/movielens/ml-100k.zip
          unzip -q ml-100k.zip -d data
      - run: jupyter nbconvert --to notebook --execute --output /tmp/out.ipynb flowshopper_recommender.ipynb
